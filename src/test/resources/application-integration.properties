server.port=0
bus.topics=robot.commands,robot.telemetry
bus.max-backlog-per-subscription=3
bus.max-backlog-per-session=6
bus.ack-timeout-millis=60000
bus.max-payload-bytes=256
bus.max-drops-before-disconnect=3
bus.poll-wait-millis=300
bus.clients[0].token=commander-token
bus.clients[0].client-id=commander
bus.clients[0].publish-topics=robot.commands
bus.clients[0].subscribe-topics=robot.telemetry
bus.clients[1].token=observer-token
bus.clients[1].client-id=observer
bus.clients[1].publish-topics=
bus.clients[1].subscribe-topics=robot.commands,robot.telemetry

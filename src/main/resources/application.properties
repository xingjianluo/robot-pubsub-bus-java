# 消息总线资源上限
bus.max-backlog-per-subscription=100
bus.ack-timeout-millis=5000
bus.max-payload-bytes=65536
bus.max-drops-before-disconnect=3
bus.max-backlog-per-session=1000
bus.max-poll-wait-millis=1000
bus.topics=robot.commands,robot.telemetry

# 本地开发令牌表（仅用于本地验证，非真实凭据）：
# 全权限机器人客户端
bus.tokens[0].token=local-robot-token
bus.tokens[0].client-id=local-robot
bus.tokens[0].publish-topics=*
bus.tokens[0].subscribe-topics=*
# 仅遥测主题的受限客户端
bus.tokens[1].token=local-telemetry-token
bus.tokens[1].client-id=local-telemetry
bus.tokens[1].publish-topics=robot.telemetry
bus.tokens[1].subscribe-topics=robot.telemetry

# ============================================================
# 机器人指令下发 / 遥测上报 本地发布订阅总线配置
# 注意：Map 键含点号（robot.cmd、cmd-controller 等）必须用 [键] 包裹，
# 否则会被松散绑定解析为嵌套层级而非字面键。
# ============================================================
spring.application.name=robot-pubsub-bus
server.port=8080

# ACK 超时：inflight 消息超过该时长未确认即重投（标记 RETRY）
robot.bus.ack-timeout-millis=2000
# 重投扫描周期
robot.bus.reaper-interval-millis=100

# ------------------------------------------------------------
# 会话身份（token -> 名称 / 可发布主题 / 可订阅主题，支持 "*" 与 "前缀.*"）
# ------------------------------------------------------------
robot.bus.principals[cmd-controller].name=commander
robot.bus.principals[cmd-controller].publish[0]=robot.cmd
robot.bus.principals[cmd-controller].subscribe[0]=robot.telemetry

robot.bus.principals[robot-01].name=robot-01
robot.bus.principals[robot-01].publish[0]=robot.telemetry
robot.bus.principals[robot-01].subscribe[0]=robot.cmd

# 越权测试用身份：只能访问遥测主题
robot.bus.principals[observer].name=observer
robot.bus.principals[observer].publish[0]=robot.telemetry
robot.bus.principals[observer].subscribe[0]=robot.telemetry

# ------------------------------------------------------------
# 主题：背压策略 / 单订阅者最大未确认积压 / 保留窗口 / 单条报文字节上限
# ------------------------------------------------------------
# 指令主题：慢消费者策略=拒绝发布（发布者得到可解释错误）
robot.bus.topics[robot.cmd].policy=REJECT
robot.bus.topics[robot.cmd].max-inflight=4
robot.bus.topics[robot.cmd].retention-size=64
robot.bus.topics[robot.cmd].max-payload-bytes=4096

# 遥测主题：慢消费者策略=丢弃最旧未确认消息（显式 Dropped 通知）
robot.bus.topics[robot.telemetry].policy=DROP_OLDEST
robot.bus.topics[robot.telemetry].max-inflight=8
robot.bus.topics[robot.telemetry].retention-size=128
robot.bus.topics[robot.telemetry].max-payload-bytes=4096
